services:
    cpparpcalc_jsbuild:
        build: dockerfiles/js
        volumes:
            - .:/src
        user: 1000:1000
    cpparpcalc_windows:
        build: dockerfiles/winqt
        volumes:
            - ./:/home/al/project
    # Experimental: statically-linked Windows build, which should start
    # faster.  Only run when asked for: docker compose up cpparpcalc_windows_static
    cpparpcalc_windows_static:
        build: dockerfiles/winqt
        volumes:
            - ./:/home/al/project
        command: ["bash", "dockerfiles/winqt/build_dockerwin_static.sh"]
        profiles: ["static"]
    # Windows build from Fedora's pre-built MinGW packages (a much quicker
    # image build than MXE).  Only run when asked for:
    # docker compose up cpparpcalc_windows_fedora
    cpparpcalc_windows_fedora:
        build: dockerfiles/winfedora
        volumes:
            - ./:/home/al/project
        profiles: ["fedora"]
    cpparpcalc_linux:
        build: dockerfiles/linuxqt
        volumes:
            - ./:/home/al/project
