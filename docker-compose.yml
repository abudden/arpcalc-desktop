services:
    # Runs the tests (see "Tests" in README.md).  First, so that dkr_seq.sh
    # stops before building anything if they fail.
    cpparpcalc_tests:
        build: dockerfiles/tests
        volumes:
            - .:/src
        user: 1000:1000
    cpparpcalc_jsbuild:
        build: dockerfiles/js
        volumes:
            - .:/src
        user: 1000:1000
    # Builds both the statically-linked and the shared (DLLs) Windows versions
    cpparpcalc_windows:
        build: dockerfiles/winqt
        volumes:
            - ./:/home/al/project
    cpparpcalc_linux:
        build: dockerfiles/linuxqt
        volumes:
            - ./:/home/al/project
